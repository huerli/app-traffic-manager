name: Build Flow Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FLOW_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Set up Linux native webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          /usr/bin/python3 -m venv --system-site-packages .build-venv
          echo "$GITHUB_WORKSPACE/.build-venv/bin" >> "$GITHUB_PATH"

      - name: Read version and validate release tag
        run: |
          python - <<'PY'
          import os
          from runtime_paths import VERSION
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + VERSION:
              raise SystemExit(f'Tag must match runtime_paths.py: v{VERSION}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'FLOW_VERSION={VERSION}\n')
          PY

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt "pyinstaller==6.22.3"

      - name: Check source syntax and desktop dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          python desktop_app.py --check

      - name: Build native application
        run: python build-desktop.py

      - name: Check packaged imports
        if: runner.os == 'Linux'
        run: dist/Flow/Flow --check

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/Flow-${FLOW_VERSION}-${FLOW_TARGET}.tar.gz" Flow

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Flow.app "release/Flow-${FLOW_VERSION}-${FLOW_TARGET}.zip"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/Flow -DestinationPath "release/Flow-$env:FLOW_VERSION-$env:FLOW_TARGET.zip"

      - name: Generate SHA256 checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path('release').iterdir()):
              with path.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              path.with_name(path.name + '.sha256').write_text(f'{checksum}  {path.name}\n', encoding='utf-8')
          PY

      - name: Upload application packages
        uses: actions/upload-artifact@v7
        with:
          name: Flow-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/**/warn-*.txt
            build/**/xref-*.html
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish version release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all application packages
        uses: actions/download-artifact@v8
        with:
          pattern: Flow-*
          path: release
          merge-multiple: true
      - name: Verify downloaded packages
        run: |
          cd release
          sha256sum --check *.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            args=(--verify-tag --generate-notes --title "Flow $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/* "${args[@]}"
          fi
