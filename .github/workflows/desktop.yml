name: Build and Release Flow Tauri App
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the version tag and GitHub Release
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            target_arg: --target x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            target_arg: --target x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15-intel
            target: x86_64-apple-darwin
            target_arg: --target x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            target_arg: --target aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate application version
        run: python script/release-assets.py version
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Install Python sidecar dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build Python sidecar
        run: python script/build-sidecar.py
      - name: Install frontend and Tauri CLI dependencies
        run: npm install --no-package-lock
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.target_arg }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Flow Traffic Manager.app"
      - name: Stage release installers
        run: python script/release-assets.py collect --target ${{ matrix.target }} --bundle src-tauri/target/${{ matrix.target }}/release/bundle --output release-assets
      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7
        with:
          name: Flow-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  release:
    concurrency:
      group: flow-release-${{ github.repository }}
      cancel-in-progress: false
    name: Publish Tauri Release
    needs: build
    if: >-
      always() && needs.build.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: Flow-*
          path: release
          merge-multiple: true
      - name: Validate version and release assets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python script/release-assets.py version)
          python script/release-assets.py verify release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft, upload installers and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [[ "$tagged_sha" != "$SHA" ]]; then
              echo "::error::Tag $tag points to $tagged_sha, not $SHA. Increase the application version before publishing."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA"
          fi
          # List explicitly so API/authentication failures cannot mean 'not found'.
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | {tag_name, draft}')
          existing=$(printf '%s\n' "$releases" | jq -s --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | first // empty')
          if [[ -n "$existing" ]]; then
            if [[ $(printf '%s' "$existing" | jq -r '.draft') != true ]]; then
              echo "::error::Release $tag is already published. Existing assets are preserved; increase the version for a new release."
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Flow $tag" --generate-notes
          fi
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          # Replacement is limited to drafts; a failed upload never changes a published release.
          gh release upload "$tag" "${assets[@]}" --clobber
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$tag" --draft=false --prerelease="$prerelease"
