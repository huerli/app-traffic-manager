name: Build Flow Desktop

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a version Release after building
        type: boolean
        default: true
      build_run_id:
        description: Reuse a successful build run ID (leave empty to rebuild)
        type: string
        required: false
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Resolve build source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      source_run: ${{ steps.source.outputs.source_run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.build_run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess
          run_id = os.environ.get('REQUESTED_RUN', '').strip()
          sha = os.environ['CURRENT_SHA']
          if run_id:
              if not run_id.isdecimal():
                  raise SystemExit('Build run ID must be numeric')
              repo = os.environ['GH_REPO']
              run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
              workflow = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/desktop.yml']))
              if (run['status'] != 'completed' or run['conclusion'] != 'success'
                      or run['workflow_id'] != workflow['id']
                      or run['event'] not in ('push', 'workflow_dispatch')
                      or run['head_repository']['full_name'].lower() != repo.lower()):
                  raise SystemExit('Only successful push/manual runs of this repository desktop workflow can be reused')
              artifacts = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts']))
              expected = {'Flow-linux-x86_64', 'Flow-windows-x86_64', 'Flow-macos-x86_64', 'Flow-macos-arm64'}
              available = {item['name'] for item in artifacts['artifacts'] if not item['expired']}
              if not expected.issubset(available):
                  raise SystemExit('Build artifacts are missing or expired; leave build_run_id empty to rebuild')
              sha = run['head_sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\nsource_run={run_id}\n')
          PYCODE
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Read source version
        id: version
        run: |
          python3 - <<'PYCODE'
          import ast, os, re
          from pathlib import Path
          tree = ast.parse(Path('runtime_paths.py').read_text(encoding='utf-8'))
          version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == 'VERSION' for target in node.targets))
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid VERSION in build source')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PYCODE

  build:
    needs: prepare
    if: needs.prepare.outputs.source_run == '' || needs.prepare.outputs.source_run == null
    name: ${{ matrix.target }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FLOW_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Set up Linux native webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          /usr/bin/python3 -m venv --system-site-packages .build-venv
          echo "$GITHUB_WORKSPACE/.build-venv/bin" >> "$GITHUB_PATH"

      - name: Read version and validate release tag
        run: |
          python - <<'PY'
          import os
          from runtime_paths import VERSION
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + VERSION:
              raise SystemExit(f'Tag must match runtime_paths.py: v{VERSION}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'FLOW_VERSION={VERSION}\n')
          PY

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt "pyinstaller==6.22.3"

      - name: Check source syntax and desktop dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          python desktop_app.py --check

      - name: Build native application
        run: python build-desktop.py

      - name: Check packaged imports
        if: runner.os == 'Linux'
        run: dist/Flow/Flow --check

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/Flow-${FLOW_VERSION}-${FLOW_TARGET}.tar.gz" Flow

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Flow.app "release/Flow-${FLOW_VERSION}-${FLOW_TARGET}.zip"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/Flow -DestinationPath "release/Flow-$env:FLOW_VERSION-$env:FLOW_TARGET.zip"

      - name: Generate SHA256 checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path('release').iterdir()):
              with path.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              path.with_name(path.name + '.sha256').write_text(f'{checksum}  {path.name}\n', encoding='utf-8')
          PY

      - name: Upload application packages
        uses: actions/upload-artifact@v7
        with:
          name: Flow-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/**/warn-*.txt
            build/**/xref-*.html
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish version release
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true')))
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all application packages
        uses: actions/download-artifact@v8
        with:
          pattern: Flow-*
          path: release
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded packages
        run: |
          cd release
          sha256sum --check *.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # Never move a version tag or attach artifacts from another commit.
          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            tag_type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
            if [[ "$tag_type" == tag ]]; then
              tag_sha=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object.sha')
            fi
            if [[ "$tag_sha" != "$BUILD_SHA" ]]; then
              echo "Version tag $RELEASE_TAG points at another commit. Bump VERSION before publishing."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$BUILD_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            args=(--verify-tag --generate-notes --title "Flow $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/* "${args[@]}"
          fi
