name: Build and Release Flow Tauri App
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the version tag and GitHub Release
        type: boolean
        default: true
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md']
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            target_arg: --target x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            target_arg: --target x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15-intel
            target: x86_64-apple-darwin
            target_arg: ''
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            target_arg: --target aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Install Python sidecar dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build Python sidecar
        run: python build-sidecar.py
      - name: Install frontend and Tauri CLI dependencies
        run: npm install --no-package-lock
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.target_arg }} --bundles ${{ matrix.bundles }}
      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7
        with:
          name: Flow-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish Tauri Release
    needs: build
    if: >-
      always() && needs.build.result == 'success' &&
      ((github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {pattern: Flow-*, path: release, merge-multiple: true, github-token: '${{ github.token }}'}
      - name: Read application version
        id: version
        run: |
          echo "version=$(python -c "import re; print(re.search(r\"VERSION = '([^']+)'\", open('runtime_paths.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Flow $tag" --notes "跨平台桌面安装包，下载对应平台版本即可使用。"
            while IFS= read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes || true
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" --verify-tag --generate-notes --title "Flow $tag" --notes "跨平台桌面安装包，下载对应平台版本即可使用。"
          fi
          mapfile -d '' assets < <(find release -type f -print0)
          gh release upload "$tag" "${assets[@]}" --clobber
