<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow</title>
<style>body{margin:0;background:#f5f6f8;color:#202b39;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}.card{max-width:560px;background:white;border:1px solid #e7ebef;border-radius:18px;padding:42px;margin:24px;box-shadow:0 12px 45px #20304c08}h1{color:#14867b;font-size:36px;margin:0 0 12px}h2{font-size:22px}p{color:#7b8593;line-height:1.9}#status{white-space:pre-wrap;overflow-wrap:anywhere;min-height:60px;color:#586373}.actions{display:flex;gap:12px;margin-top:24px}button{border:1px solid #dfe5eb;border-radius:8px;background:white;color:#586373;font:inherit;padding:11px 16px;cursor:pointer}button.primary{background:#14867b;color:white;border-color:#14867b}.hint{font-size:12px;margin-bottom:0}</style>
<div class="card"><h1>Flow</h1><h2>每个应用，走合适的网络。</h2><p id="status" role="status">正在连接本机服务并查找 Clash Verge 配置…</p><div class="actions"><button class="primary" id="retry">重新连接</button><button id="choose">选择 Clash 配置目录</button></div><p class="hint">首次使用请先启动 Clash Verge。已有规则和同步设置会自动保留。</p></div>
<script>document.getElementById('retry').onclick=()=>window.pywebview?.api.retry();document.getElementById('choose').onclick=()=>window.pywebview?.api.select_clash();</script></html>
